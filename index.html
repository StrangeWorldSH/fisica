<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Web - Exposición de Física (Gemini)</title>
    <style>
        body {
            background-color: #ffffff;
            color: #111111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #000000;
        }

        p.subtitle {
            color: #666666;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1px solid #cccccc;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: #000000;
        }

        button {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #333333;
        }

        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .status {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #666666;
        }

        .workspace {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
        }

        @media (min-width: 1024px) {
            .workspace {
                grid-template-columns: 1fr 1fr;
            }
        }

        .pane {
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            height: 500px;
            overflow: hidden;
            position: relative;
        }

        .pane-header {
            padding: 10px 16px;
            background: #f0f0f0;
            font-size: 0.8rem;
            font-weight: 600;
            color: #555555;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .maximize-btn {
            background: #ddd;
            border: none;
            padding: 3px 8px;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 4px;
            color: #333;
        }

        .maximize-btn:hover {
            background: #ccc;
        }

        .pane-content {
            padding: 16px;
            overflow-y: auto;
            flex-grow: 1;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-all;
            background: #ffffff;
        }

        #preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .fullscreen-pane {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999;
            border-radius: 0;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Generador Web con Gemini API</h1>
        <p class="subtitle">Escribe un detalle adicional si lo deseas. (Presiona <b>Enter</b> o usa el botón para generar).</p>

        <div class="input-group">
            <input type="text" id="prompt-input" placeholder="Ej: Haz que tenga música de fondo y una sección elegante...">
        </div>
        <button id="generate-btn" onclick="generateWeb()">Generar página web</button>
        <div id="status-text" class="status"></div>
    </div>

    <div class="workspace">
        <!-- Código Fuente -->
        <div class="pane">
            <div class="pane-header"><span>CÓDIGO FUENTE EN TIEMPO REAL</span></div>
            <div id="code-output" class="pane-content">Esperando generación...</div>
        </div>

        <!-- Vista Previa -->
        <div class="pane" id="preview-pane">
            <div class="pane-header">
                <span>VISTA PREVIA</span>
                <button class="maximize-btn" onclick="toggleFullscreen()">Maximizar / Minimizar</button>
            </div>
            <div style="flex-grow: 1; background: #fff; overflow: hidden;">
                <iframe id="preview-frame"></iframe>
            </div>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6LZfTaDRQASggL8rYuWG2bfjM8yWs6zLu_JRw5nv5p91g";

        // Enviar al presionar la tecla Enter en el input de texto
        document.getElementById('prompt-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                generateWeb();
            }
        });

        // Función para maximizar o minimizar la vista previa con el botón
        function toggleFullscreen() {
            document.getElementById('preview-pane').classList.toggle('fullscreen-pane');
        }

        async function generateWeb() {
            const userExtra = document.getElementById('prompt-input').value;
            const codeOutput = document.getElementById('code-output');
            const previewFrame = document.getElementById('preview-frame');
            const generateBtn = document.getElementById('generate-btn');
            const statusText = document.getElementById('status-text');

            generateBtn.disabled = true;
            codeOutput.textContent = "";
            statusText.textContent = "Conectando con Gemini...";

            const fullPrompt = `Eres un desarrollador web experto. Tu tarea es generar una página web completa, limpia, moderna y estéticamente atractiva en HTML y CSS (todo en un solo archivo) para una exposición escolar sobre la Física.
            
            Debes organizar obligatoriamente el contenido en base a estos tres puntos clave:
            1. ¿Qué es la ciencia y qué es la física? (Definiciones, método sistemático, materia, energía, espacio, tiempo).
            2. Áreas de la física según su objeto de estudio (Mecánica clásica, termodinámica, electromagnetismo, óptica, física moderna y el alcance desde lo subatómico hasta lo cósmico).
            3. Aplicaciones e importancia en la tecnología y la vida cotidiana (Ingeniería, medicina, smartphones, internet, GPS, fricción, gravedad y tareas cotidianas).

            REQUISITO DE MÚSICA: Añade obligatoriamente un elemento HTML <audio controls autoplay loop> con un enlace directo y funcional de música de fondo ambiental/relajante en formato MP3 para que suene durante la exposición.

            Detalle adicional del usuario a tomar en cuenta: "\${userExtra}"

            REGLAS:
            - Devuelve ÚNICAMENTE el código HTML bruto (comenzando con <!DOCTYPE html>).
            - NO uses bloques de código con markdown (\`\`\`html).
            - El diseño debe verse ordenado, con tipografía agradable, espacios limpios y secciones bien diferenciadas ideales para una presentación.`;

            // 1. SOLUCIÓN CORS: Usamos un proxy de AllOrigins para saltar el bloqueo del navegador
            const targetUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`;
            const proxyUrl = `https://allorigins.win{encodeURIComponent(targetUrl)}`;

            try {
                // 2. Hacemos la petición a través del Proxy usando método POST simulado
                const response = await fetch(proxyUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        // AllOrigins requiere que los parámetros reales y encabezados se envíen de este modo
                        headers: {
                            "Content-Type": "application/json",
                            "x-goog-api-key": GEMINI_API_KEY
                        },
                        method: "POST",
                        body: JSON.stringify({
                            contents: [{
                                parts: [{ text: fullPrompt }]
                            }]
                        })
                    })
                });

                if (!response.ok) {
                    throw new Error("Error en la conexión con el servidor intermediario.");
                }

                const proxyData = await response.json();
                
                // AllOrigins devuelve la respuesta real dentro de un string en 'contents'
                const actualData = JSON.parse(proxyData.contents);

                if (actualData.error) {
                    throw new Error(actualData.error.message || "Error devuelto por Gemini");
                }
                
                // Extraer el texto generado por Gemini
                const generatedCode = actualData.candidates[0].content.parts[0].text;

                // Renderizar el código en el contenedor de texto
                codeOutput.textContent = generatedCode;

                // Inyectar el código generado dentro del iframe para la Vista Previa
                const blob = new Blob([generatedCode], { type: "text/html" });
                previewFrame.src = URL.createObjectURL(blob);

                statusText.textContent = "¡Página web generada con éxito!";

            } catch (error) {
                console.error(error);
                statusText.textContent = "Error al generar: " + error.message;
                codeOutput.textContent = "Hubo un problema al evadir CORS o procesar la API.";
            } finally {
                generateBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
